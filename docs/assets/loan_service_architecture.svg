<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Loan service architecture</title><desc id="desc">Next.js client and Python crawler call a Spring Boot service backed by PostgreSQL and optional Redis cache.</desc><rect width="1080" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111827}.box{fill:#f9fafb;stroke:#4b5563;stroke-width:2}.arrow{stroke:#6b7280;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="50" y="48" font-size="25" font-weight="700">Loan service V2</text><rect class="box" x="55" y="125" width="180" height="78" rx="8"/><text x="103" y="158" font-size="16">Next.js UI</text><text x="82" y="183" font-size="13">decision interface</text><rect class="box" x="55" y="300" width="180" height="78" rx="8"/><text x="90" y="333" font-size="16">Python crawler</text><text x="84" y="358" font-size="13">product ingestion</text><rect class="box" x="345" y="200" width="260" height="115" rx="8"/><text x="410" y="235" font-size="18" font-weight="700">Spring Boot API</text><text x="383" y="265" font-size="13">BigDecimal simulation</text><text x="383" y="287" font-size="13">transaction · idempotency · @Version</text><rect class="box" x="730" y="125" width="200" height="78" rx="8"/><text x="779" y="158" font-size="16">PostgreSQL</text><text x="758" y="183" font-size="13">source of truth</text><rect class="box" x="730" y="300" width="200" height="78" rx="8"/><text x="790" y="333" font-size="16">Redis</text><text x="752" y="358" font-size="13">optional read cache</text><line class="arrow" x1="235" y1="164" x2="345" y2="235"/><line class="arrow" x1="235" y1="339" x2="345" y2="280"/><line class="arrow" x1="605" y1="235" x2="730" y2="164"/><line class="arrow" x1="605" y1="280" x2="730" y2="339"/><text x="55" y="455" font-size="14">Design boundary: transaction/locking lives in the loan service; Kafka/event streaming is intentionally left to the commerce-events project.</text></svg>
