services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loan_service
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: loan
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan -d loan_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"
