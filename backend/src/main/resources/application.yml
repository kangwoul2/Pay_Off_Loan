spring:
  application:
    name: loan-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loan_service}
    username: ${DATABASE_USER:loan}
    password: ${DATABASE_PASSWORD:loan}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cache:
    type: simple

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
